name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and type-check
        run: |
          node --test lib/tabs.test.ts
          npx tsc --noEmit

      - name: Lint changed source
        run: npx oxlint app/layout.tsx app/page.tsx components/file-glyph.tsx lib/files.ts lib/visits.ts lib/tabs.test.ts next.config.ts vite.config.ts scripts/check-static-export.mjs

      - name: Build static site
        run: npm run build

      - name: Check static export
        run: npm run check:static

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
